; Example independent worker pools for Gambia SchoolOS (Phase 5).
; Adjust user, path, and numprocs per environment. Prefer Redis QUEUE_CONNECTION in production.
;
; Critical / default — never starve these when shedding load.
; Imports / exports / notifications / reports — pause first under overload (see docs/runbooks/overload-shedding.md).

[program:schoolos-worker-critical]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gbschools/artisan queue:work --sleep=1 --tries=3 --max-time=3600 --queue=critical,default
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/schoolos-worker-critical.log

[program:schoolos-worker-imports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gbschools/artisan queue:work --sleep=1 --tries=3 --max-time=3600 --queue=imports
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/schoolos-worker-imports.log

[program:schoolos-worker-bulk]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/gbschools/artisan queue:work --sleep=1 --tries=3 --max-time=3600 --queue=exports,notifications,reports
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/schoolos-worker-bulk.log
