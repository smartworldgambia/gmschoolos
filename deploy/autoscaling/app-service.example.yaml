# Example autoscaling policy for the web/app tier (host-agnostic sketch).
# Map these knobs to Laravel Cloud, ECS Service Auto Scaling, or equivalent.
# Caps come from config/schoolos.php autoscaling.* — never unbounded.

apiVersion: schoolos.scale/v1
kind: AppServiceAutoscaling
metadata:
  name: schoolos-app
  labels:
    project: schoolos
    service: app
spec:
  minReplicas: 1          # SCHOOLOS_AS_APP_MIN
  maxReplicas: 4          # SCHOOLOS_AS_APP_MAX
  metrics:
    - type: Resource
      resource: cpu
      targetAverageUtilization: 65   # SCHOOLOS_AS_TARGET_CPU
    - type: External
      metric: http_p95_latency_ms
      target: 800
  constraints:
    dbConnectionBudget: 80          # SCHOOLOS_DB_CONNECTION_BUDGET — app scale-out must respect this
  scaleDown:
    stabilizationWindowSeconds: 300
  scaleUp:
    stabilizationWindowSeconds: 60
  notes: >
    Prefer faster scale-out and conservative scale-in. Schedule capacity for
    exam/registration windows. Validate with loadtests/k6 before raising maxReplicas.
